name: 同步安装包与发布日志

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: sync-apk
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: 同步安装包与发布日志
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPO: ErlangShen-AI/DeepSeek-Whale-Pet-Android
      SOURCE_BRANCH: main
      APK: downloads/DeepSeek-Whale-Pet.apk
      INFO: downloads/latest.json
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        env:
          # 让 git init 的初始分支名为 main，抑制初始化仓库时的提示文本
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: 取回发布页正文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh api "repos/$SOURCE_REPO/releases/tags/latest" --jq '.body // ""' > downloads/release-notes.md

      - name: 按发布资产时间取回安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE=$(gh api "repos/$SOURCE_REPO/releases/tags/latest" --jq '.assets[0].updated_at')
          LOCAL=$(jq -r '.updatedAt // ""' "$INFO" 2>/dev/null || printf '')
          if [ -f "$APK" ] && [ "$REMOTE" = "$LOCAL" ]; then
            printf '安装包未更新，跳过下载\n'
            exit 0
          fi
          gh release download latest --repo "$SOURCE_REPO" --pattern '*.apk' --clobber --dir downloads
          printf '已取回安装包\n'

      - name: 同步源仓库说明文件
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$SOURCE_REPO/$SOURCE_BRANCH/README.md" -o downloads/upstream-readme.md
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$SOURCE_REPO/$SOURCE_BRANCH/LICENSE" -o downloads/upstream-license.txt

      - name: 写入安装包信息
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREVIOUS=$(jq -r '.version // ""' "$INFO" 2>/dev/null || printf '')
          VERSION=$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/$SOURCE_REPO/$SOURCE_BRANCH/app/build.gradle.kts" |
            sed -n 's/.*versionName = "\(.*\)"/\1/p' | head -n 1 || true)
          [ -n "$VERSION" ] || VERSION="$PREVIOUS"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d ' ' -f 1)
          UPDATED=$(gh api "repos/$SOURCE_REPO/releases/tags/latest" --jq '.assets[0].updated_at')
          jq -n --arg version "$VERSION" --argjson size "$SIZE" --arg sha256 "$SHA" --arg updatedAt "$UPDATED" \
            '{version: $version, size: $size, sha256: $sha256, updatedAt: $updatedAt}' > "$INFO"
          cat "$INFO"

      - name: 提交更新
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            printf '安装包没有变化\n'
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "同步安装包与发布日志"
          git push
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: 触发页面部署
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"

      - name: 清理历史运行
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for workflow in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[].id' 2>/dev/null || true); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null | tail -n +6 | while read -r run; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /dev/null 2>&1 || true
              done
          done
          printf '每个工作流保留最近 5 次运行\n'
