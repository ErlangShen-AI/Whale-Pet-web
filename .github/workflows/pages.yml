name: 部署页面

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署页面
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置页面
        uses: actions/configure-pages@v6

      - name: 打包站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: 部署站点
        id: deployment
        uses: actions/deploy-pages@v5
